<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Lab (prototype)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: sans-serif;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #0b0e16;
        color: #e6e9f2;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        color: #8890b0;
        font-size: 13px;
        margin-bottom: 18px;
      }
      section {
        background: #131826;
        border: 1px solid #262d42;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
        color: #cfd3e6;
      }
      button {
        background: #1c2438;
        color: #e6e9f2;
        border: 1px solid #3a4570;
        border-radius: 5px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        margin: 2px;
      }
      button:hover {
        background: #263153;
      }
      button.active {
        background: #d39f3f;
        color: #1a1204;
        border-color: #f2c14e;
      }
      button.missing {
        opacity: 0.7;
      }
      button.big {
        font-size: 15px;
        padding: 10px 18px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 6px;
      }
      .badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: 6px;
        background: #402828;
        color: #f2a0a0;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        margin: 6px 0;
      }
      input[type="range"] {
        flex: 1;
      }
      #state {
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 11px;
        background: #0a0d16;
        border-radius: 6px;
        padding: 8px 10px;
        max-height: 220px;
        overflow: auto;
      }
      .category {
        font-size: 11px;
        color: #8890b0;
        margin: 8px 0 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>🎧 Audio Lab (prototype)</h1>
    <div class="sub">
      독립 오디오 시스템 검증 도구 — LaneBattleScene/main.ts와 무관, 실제 게임에는 연결되어 있지 않음.
      <code>src/systems/audio</code>의 실제 모듈을 그대로 사용합니다.
    </div>

    <section>
      <h2>0. 오디오 활성화 (브라우저 자동재생 제한)</h2>
      <button id="unlockBtn" class="big">🔓 오디오 활성화</button>
      <span id="unlockStatus"></span>
    </section>

    <section>
      <h2>1. AudioDirector — 상황별 음악 상태</h2>
      <div id="directorButtons" class="row"></div>
      <label>
        crossfade 시간(ms)
        <input id="crossfadeRange" type="range" min="100" max="4000" step="100" value="1200" />
        <span id="crossfadeValue">1200</span>
      </label>
    </section>

    <section>
      <h2>2. BGM 개별 재생</h2>
      <div id="bgmButtons" class="grid"></div>
      <div class="row" style="margin-top: 8px">
        <button id="stopBgmBtn">■ BGM 정지</button>
      </div>
    </section>

    <section>
      <h2>3. 볼륨 / 설정</h2>
      <label>Master <input id="masterRange" type="range" min="0" max="1" step="0.01" /> <span id="masterValue"></span></label>
      <label>BGM <input id="bgmRange" type="range" min="0" max="1" step="0.01" /> <span id="bgmValue"></span></label>
      <label>SFX <input id="sfxRange" type="range" min="0" max="1" step="0.01" /> <span id="sfxValue"></span></label>
      <label><input id="muteCheck" type="checkbox" /> 전체 음소거</label>
      <label><input id="unfocusCheck" type="checkbox" /> 탭 비활성화 시 음소거</label>
      <label>전투 효과음
        <select id="combatSfxMode">
          <option value="off">끔</option>
          <option value="reduced">축소</option>
          <option value="full">전체</option>
        </select>
      </label>
      <div class="row">
        <button id="resetSettingsBtn">설정 초기화</button>
        <button id="reloadBtn">🔄 새로고침해서 설정 복원 확인</button>
      </div>
    </section>

    <section>
      <h2>4. SFX (카테고리별)</h2>
      <div id="sfxContainer"></div>
      <div class="row" style="margin-top: 8px">
        <button id="stopAllSfxBtn">■ 모든 SFX 정지</button>
        <button id="spamTestBtn">⚡ 연타 테스트 (unitHit x20)</button>
      </div>
    </section>

    <section>
      <h2>5. 상태 / 진단</h2>
      <pre id="state"></pre>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
